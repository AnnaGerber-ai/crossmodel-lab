name: Verify Pressure Ladder v4 archive repair

on:
  push:
    branches:
      - pressure-v4-archive-repair-20261002
    paths:
      - "results/pressure-ladder-v4-confirmatory-main-01/archive/scoring-results.zip.b64"
      - ".github/workflows/pressure-v4-archive-repair-verify.yml"

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify repaired scoring archive
        run: |
          set -euo pipefail
          A="results/pressure-ladder-v4-confirmatory-main-01/archive"
          base64 -d "$A/scoring-results.zip.b64" > /tmp/scoring-results.zip
          echo "79d11e264c56f450a9872c19fd8fa009b0231eaf36d20c8be7117667da3d6be4  /tmp/scoring-results.zip" | sha256sum -c -
          unzip -t /tmp/scoring-results.zip

      - name: Verify exact collection artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11150146210/zip" \
            -o /tmp/collection.zip
          echo "c06a063ba0186565e1f5e21459b2db11a3293e80d76d457a7fa1942236b25234  /tmp/collection.zip" | sha256sum -c -
          unzip -t /tmp/collection.zip

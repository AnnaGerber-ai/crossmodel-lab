name: Verify Pressure Ladder v4 archive repair

on:
  push:
    branches:
      - pressure-v4-archive-repair-20261002
    paths:
      - "results/pressure-ladder-v4-confirmatory-main-01/archive/scoring-results.zip.b64"
      - "results/pressure-ladder-v4-confirmatory-main-01/archive/scoring-results.zip.b64.part00"
      - "results/pressure-ladder-v4-confirmatory-main-01/archive/scoring-results.zip.b64.part01"
      - ".github/workflows/pressure-v4-archive-repair-verify.yml"

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose and verify scoring archive
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, pathlib, string, zipfile
          A=pathlib.Path("results/pressure-ladder-v4-confirmatory-main-01/archive")
          target="79d11e264c56f450a9872c19fd8fa009b0231eaf36d20c8be7117667da3d6be4"
          cur="".join((A/"scoring-results.zip.b64").read_text().split())
          p0="".join((A/"scoring-results.zip.b64.part00").read_text().split())
          p1="".join((A/"scoring-results.zip.b64.part01").read_text().split())
          suffix=cur[-10000:]
          alphabet=string.ascii_uppercase+string.ascii_lowercase+string.digits+"+/"
          print("current_sha256", hashlib.sha256(base64.b64decode(cur)).hexdigest())
          try:
              with zipfile.ZipFile(io.BytesIO(base64.b64decode(cur))) as z:
                  print("current_zip_test", z.testzip())
          except Exception as e:
              print("current_zip_error", repr(e))
          assert len(p0)==9999 and len(p1)==16000 and len(suffix)==10000
          pos=3617
          found=None
          for ch in alphabet:
              s=p0[:pos]+ch+p0[pos:]+p1+suffix
              raw=base64.b64decode(s, validate=True)
              if hashlib.sha256(raw).hexdigest()==target:
                  found=(ch,s,raw)
                  break
          if not found:
              raise SystemExit("no target SHA among 64 insertions at part00 offset 3617")
          ch,s,raw=found
          print("FOUND_CHAR", ch)
          print("FOUND_BASE64_LEN", len(s))
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              bad=z.testzip()
              print("FOUND_ZIP_TEST", bad)
              if bad is not None:
                  raise SystemExit(f"zip CRC failure: {bad}")
          PY

      - name: Verify exact collection artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11150146210/zip" \
            -o /tmp/collection.zip
          echo "c06a063ba0186565e1f5e21459b2db11a3293e80d76d457a7fa1942236b25234  /tmp/collection.zip" | sha256sum -c -
          unzip -t /tmp/collection.zip

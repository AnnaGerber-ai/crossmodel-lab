name: Pressure Ladder v4 main v1.2.1 candidate check

on:
  push:
    branches: [pressure-main-v1.2.1-sentinel-fix]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exact frozen dependencies
        run: |
          python -m venv .main-venv
          . .main-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r tests/pressure-ladder-v4-main/dependency-freeze.txt

      - name: Compile, smoke, design
        run: |
          . .main-venv/bin/activate
          python -m py_compile tools/pressure_main.py
          python tools/pressure_main.py smoke
          python tools/pressure_main.py check-design             --scenarios tests/pressure-ladder-v4/scenarios-main-candidate-v0.2.json             --manifest tests/pressure-ladder-v4-main/manifest-main-v1.json             --config-a configs/pressure-ladder-v4-main-a.json             --config-c configs/pressure-ladder-v4-main-c.json

      - name: Verify ignored sentinel can be staged with force-add
        run: |
          SENTINEL=runs/pressure-ladder-v4-main/COLLECTION-DISPATCHED
          mkdir -p "$(dirname "$SENTINEL")"
          echo "candidate-only" > "$SENTINEL"
          git add -f "$SENTINEL"
          git diff --cached --name-only | grep -Fx "$SENTINEL"
          git reset -- "$SENTINEL"
          rm -f "$SENTINEL"

      - name: Build v1.2.1 freeze candidate
        run: |
          mkdir -p /tmp/v121-freeze
          cat > /tmp/v121-freeze/normative-files.txt <<'EOF'
          tests/pressure-ladder-v4/confirmatory-main-prereg-v0.2.1.md
          tests/pressure-ladder-v4/scenarios-main-candidate-v0.2.json
          tests/pressure-ladder-v4/main-endpoint-censoring-v0.2.1.md
          tests/pressure-ladder-v4/main-rater-protocol-v0.2.md
          tests/pressure-ladder-v4/position-evaluator-instructions-main-v1.md
          tests/pressure-ladder-v4/warmth-evaluator-instructions-main-v1.md
          tests/pressure-ladder-v4-main/backoff-policy-v1.2.md
          tests/pressure-ladder-v4-main/collection-dispatch-policy-v1.2.md
          tests/pressure-ladder-v4-main/scoring-contract-v1.2.md
          tests/pressure-ladder-v4-main/position-score-schema-v1.json
          tests/pressure-ladder-v4-main/warmth-score-schema-v1.json
          tests/pressure-ladder-v4-main/rater-failure-schema-v1.json
          tests/pressure-ladder-v4-main/rater-attempt-log-schema-v1.json
          tests/pressure-ladder-v4-main/rater-metadata-template.json
          tests/pressure-ladder-v4-main/implementation-freeze-checklist.md
          tests/pressure-ladder-v4-main/manifest-main-v1.json
          tests/pressure-ladder-v4-main/dependency-freeze.txt
          configs/pressure-ladder-v4-main-a.json
          configs/pressure-ladder-v4-main-c.json
          tools/pressure_main.py
          .github/workflows/pressure-ladder-v4-main.yml
          EOF
          xargs sha256sum < /tmp/v121-freeze/normative-files.txt > /tmp/v121-freeze/freeze-checksums-v1.2.1.sha256
          sha256sum -c /tmp/v121-freeze/freeze-checksums-v1.2.1.sha256
          cp .github/workflows/pressure-ladder-v4-main.yml /tmp/v121-freeze/
          {
            echo "candidate_head=$GITHUB_SHA"
            echo "workflow_sha256=$(sha256sum .github/workflows/pressure-ladder-v4-main.yml | awk '{print $1}')"
            echo "manifest_sha256=$(sha256sum tests/pressure-ladder-v4-main/manifest-main-v1.json | awk '{print $1}')"
            echo "runner_sha256=$(sha256sum tools/pressure_main.py | awk '{print $1}')"
          } > /tmp/v121-freeze/metadata.txt

      - name: Upload v1.2.1 freeze candidate
        uses: actions/upload-artifact@v4
        with:
          name: pressure-ladder-v4-main-v121-freeze-candidate
          path: /tmp/v121-freeze/
          retention-days: 30

name: Pressure Ladder v4 self-hosted runner probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pressure-ladder-v4-selfhost-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Confirm runner
        run: |
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          python --version || python3 --version

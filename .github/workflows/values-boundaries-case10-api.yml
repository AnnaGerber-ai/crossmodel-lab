name: Values & Boundaries Case 10 API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  case10-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runner dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Russian config
        run: >
          python tools/run_prompt_set.py
          --config configs/values-boundaries-case10-api-ru.json
          --model qwen-flash-character
          --dry-run

      - name: Validate English config
        run: >
          python tools/run_prompt_set.py
          --config configs/values-boundaries-case10-api-en.json
          --model qwen-flash-character
          --dry-run

      - name: Run Russian samples
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
        run: >
          python tools/run_prompt_set.py
          --config configs/values-boundaries-case10-api-ru.json
          --model qwen-flash-character
          --output runs/values-boundaries-case10-api-ru.jsonl

      - name: Run English samples
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
        run: >
          python tools/run_prompt_set.py
          --config configs/values-boundaries-case10-api-en.json
          --model qwen-flash-character
          --output runs/values-boundaries-case10-api-en.jsonl

      - name: Upload raw run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: values-boundaries-case10-api-run-01
          path: |
            runs/values-boundaries-case10-api-ru.jsonl
            runs/values-boundaries-case10-api-en.jsonl
          if-no-files-found: warn
          retention-days: 14

name: Preserve Pressure Ladder v4 reproducibility archive

on:
  push:
    branches: [main]
    paths:
      - "results/pressure-ladder-v4-confirmatory-main-01/archive/scoring-results.zip.b64"

permissions:
  contents: write
  actions: read

jobs:
  preserve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Materialize scoring/results archive
        run: |
          set -euo pipefail
          A="results/pressure-ladder-v4-confirmatory-main-01/archive"
          base64 -d "$A/scoring-results.zip.b64" > "$A/pressure-ladder-v4-confirmatory-results-2026-10-01.zip"
          echo "79d11e264c56f450a9872c19fd8fa009b0231eaf36d20c8be7117667da3d6be4  $A/pressure-ladder-v4-confirmatory-results-2026-10-01.zip" | sha256sum -c -

      - name: Download exact collection artifact before retention expiry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          A="results/pressure-ladder-v4-confirmatory-main-01/archive"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11150146210/zip" \
            -o "$A/pressure-ladder-v4-confirmatory-main-36834208704.zip"
          echo "c06a063ba0186565e1f5e21459b2db11a3293e80d76d457a7fa1942236b25234  $A/pressure-ladder-v4-confirmatory-main-36834208704.zip" | sha256sum -c -

      - name: Replace transport base64 with durable binary archives
        run: |
          set -euo pipefail
          A="results/pressure-ladder-v4-confirmatory-main-01/archive"
          rm "$A/scoring-results.zip.b64"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$A"
          git commit -m "archive: preserve Pressure Ladder v4 analysis inputs"
          git push origin HEAD:main

name: Pressure Ladder v4 targeted revalidation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runner dependencies
        run: python -m pip install -r requirements.txt

      - name: Check frozen revalidation materials
        run: >
          python tools/check_pressure_revalidation.py
          --scenarios tests/pressure-ladder-v4-revalidation/scenarios-revalidation-v1.json
          --manifest tests/pressure-ladder-v4-revalidation/manifest-revalidation.json
          --config-a configs/pressure-ladder-v4-revalidation-a.json
          --config-c configs/pressure-ladder-v4-revalidation-c.json

      - name: Dry run
        run: >
          python tools/run_pressure_ladder.py
          --manifest tests/pressure-ladder-v4-revalidation/manifest-revalidation.json
          --config-a configs/pressure-ladder-v4-revalidation-a.json
          --config-c configs/pressure-ladder-v4-revalidation-c.json
          --output runs/pressure-ladder-v4-revalidation/revalidation.jsonl
          --dry-run

      - name: Run targeted revalidation
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
        run: >
          python tools/run_pressure_ladder.py
          --manifest tests/pressure-ladder-v4-revalidation/manifest-revalidation.json
          --config-a configs/pressure-ladder-v4-revalidation-a.json
          --config-c configs/pressure-ladder-v4-revalidation-c.json
          --output runs/pressure-ladder-v4-revalidation/revalidation.jsonl

      - name: Upload raw outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pressure-ladder-v4-revalidation
          path: runs/pressure-ladder-v4-revalidation/
          if-no-files-found: warn
          retention-days: 90

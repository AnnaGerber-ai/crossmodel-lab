name: Pressure Ladder v4 synthetic latency probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pressure-ladder-v4-latency-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install frozen dependencies
        run: python -m pip install -r tests/pressure-ladder-v4-main/dependency-freeze.txt

      - name: Run 30 sequential non-battery calls
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
        run: |
          python - <<'PY'
          import json, os, statistics, time
          from pathlib import Path
          from openai import OpenAI
          from tools.pressure_main import call_with_frozen_backoff, REQUEST_TIMEOUT_SECONDS

          cfg_a = json.loads(Path("configs/pressure-ladder-v4-main-a.json").read_text())
          cfg_c = json.loads(Path("configs/pressure-ladder-v4-main-c.json").read_text())
          client = OpenAI(
              api_key=os.environ["DASHSCOPE_API_KEY"],
              base_url=os.environ["QWEN_BASE_URL"],
              max_retries=0,
              timeout=REQUEST_TIMEOUT_SECONDS,
          )

          out = []
          for i in range(30):
              cfg = cfg_a if i % 2 == 0 else cfg_c
              cond = cfg["condition"]
              prompt = (
                  f"Синтетическая проверка задержки #{i+1}. "
                  "Ответь по-русски пятью короткими предложениями о нейтральной бытовой теме: "
                  "как организовать рабочий стол. Не используй списки и не упоминай этот тест."
              )
              messages = []
              if cfg.get("system_prompt"):
                  messages.append({"role": "system", "content": cfg["system_prompt"]})
              messages.append({"role": "user", "content": prompt})
              t0 = time.monotonic()
              call = call_with_frozen_backoff(
                  client,
                  model=cfg["model"],
                  messages=messages,
                  generation=cfg["generation"],
              )
              elapsed = time.monotonic() - t0
              attempts = len(call.get("request_attempts", []))
              row = {
                  "index": i + 1,
                  "condition_like": cond,
                  "elapsed_seconds": elapsed,
                  "kind": call["kind"],
                  "request_attempts": attempts,
              }
              if call["kind"] == "response":
                  response = call["response"]
                  row["provider_model"] = getattr(response, "model", None)
                  choices = getattr(response, "choices", None) or []
                  if choices:
                      msg = getattr(choices[0], "message", None)
                      text = getattr(msg, "content", None) if msg is not None else None
                      row["output_chars"] = len(str(text or ""))
                      row["finish_reason"] = getattr(choices[0], "finish_reason", None)
              out.append(row)
              print(json.dumps(row, ensure_ascii=False), flush=True)

          Path("latency-probe").mkdir(exist_ok=True)
          Path("latency-probe/raw.json").write_text(json.dumps(out, ensure_ascii=False, indent=2) + "\n")

          ok = [r["elapsed_seconds"] for r in out if r["kind"] == "response"]
          ok_sorted = sorted(ok)
          def quantile(p):
              if not ok_sorted:
                  return None
              idx = round((len(ok_sorted)-1)*p)
              return ok_sorted[idx]

          summary = {
              "calls_planned": 30,
              "calls_successful": len(ok),
              "calls_failed": len(out)-len(ok),
              "mean_seconds": statistics.mean(ok) if ok else None,
              "median_p50_seconds": statistics.median(ok) if ok else None,
              "p90_seconds": quantile(0.90),
              "p95_seconds": quantile(0.95),
              "max_seconds": max(ok) if ok else None,
              "total_probe_seconds": sum(r["elapsed_seconds"] for r in out),
              "estimated_1392_calls_hours_at_mean": (statistics.mean(ok)*1392/3600) if ok else None,
              "estimated_1392_calls_hours_at_p95": (quantile(0.95)*1392/3600) if ok else None,
              "note": "Synthetic non-battery latency probe only; not confirmatory data."
          }
          Path("latency-probe/summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n")
          print("SUMMARY", json.dumps(summary, ensure_ascii=False), flush=True)
          PY

      - name: Upload latency probe
        uses: actions/upload-artifact@v4
        with:
          name: pressure-ladder-v4-latency-probe
          path: latency-probe/
          retention-days: 30

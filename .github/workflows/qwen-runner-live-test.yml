name: Qwen runner live test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runner dependencies
        run: python -m pip install -r requirements.txt

      - name: Run one live Qwen request
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
        run: >
          python tools/run_prompt_set.py
          --config configs/first-live-run.json
          --model qwen3.8-omni-flash
          --output runs/first-live-run.jsonl

      - name: Upload raw run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-live-run
          path: runs/first-live-run.jsonl
          if-no-files-found: warn
          retention-days: 7

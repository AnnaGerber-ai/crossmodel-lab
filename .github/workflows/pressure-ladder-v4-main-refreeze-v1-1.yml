name: Refreeze Pressure Ladder v4 main implementation v1.1

on:
  push:
    paths:
      - "tests/pressure-ladder-v4-main/BUILD_REFREEZE_V1_1"

permissions:
  contents: write

jobs:
  refreeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refuse duplicate v1.1 freeze
        run: |
          test ! -e tests/pressure-ladder-v4-main/main-freeze-v1.1.md
          test ! -e tests/pressure-ladder-v4-main/freeze-checksums-v1.1.sha256
          test -f tests/pressure-ladder-v4-main/main-freeze.md
          test -f tests/pressure-ladder-v4-main/freeze-checksums.sha256

      - name: Verify reviewed design authority is unchanged
        run: |
          echo "6f600087622319254b1c272e9d6155586175e55668d84a49365aa67177d5deae  tests/pressure-ladder-v4/confirmatory-main-prereg-v0.2.1.md" | sha256sum -c -
          echo "07e49a07926f19dbda90f12525d002cc46e3f407d56a4ddce5641c6888867ccf  tests/pressure-ladder-v4/scenarios-main-candidate-v0.2.json" | sha256sum -c -
          echo "ef29d41e7365cc4cb6d838644f8c86364eb16bcabd5228b925e752347374b897  tests/pressure-ladder-v4/main-endpoint-censoring-v0.2.1.md" | sha256sum -c -
          echo "814fd944c88e9ae92a7999cb4410186ad8dcdff5dd35c9e5c8a8c0d8e60ca5ba  tests/pressure-ladder-v4/main-rater-protocol-v0.2.md" | sha256sum -c -
          echo "2389e899644115179d3341780dc5a61702ac04b13940d3bbad7d50a5b0d7facf  tests/pressure-ladder-v4/position-evaluator-instructions-main-v1.md" | sha256sum -c -
          echo "4093c903e563af6cbca5e1395b07280d70966bf395607f7341b49ceb6422afdd  tests/pressure-ladder-v4/warmth-evaluator-instructions-main-v1.md" | sha256sum -c -

      - name: Install exact v1 dependency environment
        run: |
          python -m venv .refreeze-venv
          . .refreeze-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r tests/pressure-ladder-v4-main/dependency-freeze.txt

      - name: Compile and synthetic smoke
        run: |
          . .refreeze-venv/bin/activate
          python -m py_compile tools/pressure_main.py
          python tools/pressure_main.py smoke

      - name: Recheck deterministic manifest and design
        run: |
          . .refreeze-venv/bin/activate
          python tools/pressure_main.py make-manifest \
            --scenarios tests/pressure-ladder-v4/scenarios-main-candidate-v0.2.json \
            --output /tmp/manifest-main-v1.json
          cmp /tmp/manifest-main-v1.json tests/pressure-ladder-v4-main/manifest-main-v1.json
          python tools/pressure_main.py check-design \
            --scenarios tests/pressure-ladder-v4/scenarios-main-candidate-v0.2.json \
            --manifest tests/pressure-ladder-v4-main/manifest-main-v1.json \
            --config-a configs/pressure-ladder-v4-main-a.json \
            --config-c configs/pressure-ladder-v4-main-c.json
          python tools/pressure_main.py run \
            --scenarios tests/pressure-ladder-v4/scenarios-main-candidate-v0.2.json \
            --manifest tests/pressure-ladder-v4-main/manifest-main-v1.json \
            --config-a configs/pressure-ladder-v4-main-a.json \
            --config-c configs/pressure-ladder-v4-main-c.json \
            --audit /tmp/main-v11-audit.jsonl \
            --canonical /tmp/main-v11-canonical.jsonl \
            --dry-run

      - name: Create v1.1 checksums and freeze record
        env:
          PRE_FREEZE_HEAD: ${{ github.sha }}
        run: |
          FILES=(
            tests/pressure-ladder-v4/confirmatory-main-prereg-v0.2.1.md
            tests/pressure-ladder-v4/scenarios-main-candidate-v0.2.json
            tests/pressure-ladder-v4/main-endpoint-censoring-v0.2.1.md
            tests/pressure-ladder-v4/main-rater-protocol-v0.2.md
            tests/pressure-ladder-v4/position-evaluator-instructions-main-v1.md
            tests/pressure-ladder-v4/warmth-evaluator-instructions-main-v1.md
            tests/pressure-ladder-v4-main/backoff-policy-v1.1.md
            tests/pressure-ladder-v4-main/scoring-contract-v1.md
            tests/pressure-ladder-v4-main/position-score-schema-v1.json
            tests/pressure-ladder-v4-main/warmth-score-schema-v1.json
            tests/pressure-ladder-v4-main/rater-failure-schema-v1.json
            tests/pressure-ladder-v4-main/rater-metadata-template.json
            tests/pressure-ladder-v4-main/implementation-freeze-checklist.md
            tests/pressure-ladder-v4-main/manifest-main-v1.json
            tests/pressure-ladder-v4-main/dependency-freeze.txt
            configs/pressure-ladder-v4-main-a.json
            configs/pressure-ladder-v4-main-c.json
            tools/pressure_main.py
            .github/workflows/pressure-ladder-v4-main.yml
          )
          sha256sum "${FILES[@]}" > tests/pressure-ladder-v4-main/freeze-checksums-v1.1.sha256
          MANIFEST_SHA=$(sha256sum tests/pressure-ladder-v4-main/manifest-main-v1.json | cut -d' ' -f1)
          TOOL_SHA=$(sha256sum tools/pressure_main.py | cut -d' ' -f1)
          POLICY_SHA=$(sha256sum tests/pressure-ladder-v4-main/backoff-policy-v1.1.md | cut -d' ' -f1)
          cat > tests/pressure-ladder-v4-main/main-freeze-v1.1.md <<EOF
          # Pressure Ladder v4 — confirmatory main implementation freeze v1.1

          **Status:** **FROZEN / COLLECTION AUTHORIZED UNDER v1.1 ONLY.**

          This implementation freeze supersedes implementation freeze v1 (commit `95b5632e94dd715adc6db92a8867f80112d28183`) **before confirmatory-main collection**. The reviewed study design is unchanged.

          Reason for v1.1: close the final B1 implementation path so an earlier empty/content-filter/final-4xx event can never be indirectly re-sampled by a later whole-run retry. The client backoff policy is also explicitly included in the normative freeze bundle.

          - Pre-freeze v1.1 implementation head: `${PRE_FREEZE_HEAD}`
          - Planned runs: **348** = 300 factual-primary + 48 controls
          - Conditions: **174 A / 174 C**
          - Manifest SHA-256: `${MANIFEST_SHA}`
          - Runner SHA-256: `${TOOL_SHA}`
          - Backoff policy v1.1 SHA-256: `${POLICY_SHA}`
          - Full normative checksums: `tests/pressure-ladder-v4-main/freeze-checksums-v1.1.sha256`

          The collection workflow requires this v1.1 freeze and verifies every v1.1 checksum before any API call. A mismatch blocks collection.

          Design authority remains:
          - `tests/pressure-ladder-v4/confirmatory-main-prereg-v0.2.1.md`
          - `tests/pressure-ladder-v4/main-endpoint-censoring-v0.2.1.md`
          - `tests/pressure-ladder-v4/main-rater-protocol-v0.2.md`

          Implementation authority:
          - `tools/pressure_main.py`
          - `tests/pressure-ladder-v4-main/backoff-policy-v1.1.md`
          - `tests/pressure-ladder-v4-main/scoring-contract-v1.md`
          - `tests/pressure-ladder-v4-main/manifest-main-v1.json`
          - `tests/pressure-ladder-v4-main/dependency-freeze.txt`
          - `.github/workflows/pressure-ladder-v4-main.yml`

          Historical v1 freeze/checksum files are retained for provenance but are not authorization for collection.

          Any substantive later modification to a v1.1 frozen file requires a new prospective implementation freeze. A stopped collection may not be repaired or completed by overwriting this freeze.
          EOF

      - name: Commit v1.1 freeze artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/pressure-ladder-v4-main/freeze-checksums-v1.1.sha256 \
                  tests/pressure-ladder-v4-main/main-freeze-v1.1.md
          git commit -m "freeze: pressure ladder v4 main implementation v1.1"
          git push
